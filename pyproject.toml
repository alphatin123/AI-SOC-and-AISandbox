[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aisoc"
version = "0.1.0"
description = "AI-IDPS (dual_model) + constrained Agent sandbox + OpenWorkProof-aligned verifiable evidence chain"
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
test = ["pytest>=8"]
# `python -m aisoc capture` (Architecture 1 data collection). Also needs the system package
# tshark / wireshark-cli and CAP_NET_RAW (or root) for live interfaces.
capture = ["pyshark>=0.6"]

[project.scripts]
aisoc = "aisoc.cli:main"

[tool.setuptools.packages.find]
include = ["aisoc*", "services*"]

[tool.setuptools.package-data]
aisoc = ["dashboard.html", "lucide.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
